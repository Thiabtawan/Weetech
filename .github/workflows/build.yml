name: Build EXE
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name GPIO_Monitor gpio_monitor.py
      - uses: actions/upload-artifact@v4
        with:
          name: GPIO_Monitor
          path: dist/GPIO_Monitor.exe
